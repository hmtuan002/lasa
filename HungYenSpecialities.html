<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Binh Traditional Craft Villages</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #f5f5f5;
        }
        #pdf-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
            position: relative;
        }
        .pdf-page-container {
            margin-bottom: 1px;
            background: white;
            box-shadow: 0 0 0 1px #eee;
            position: relative;
        }
        .pdf-page {
            display: block;
            width: 100%;
        }
        .video-embed-wrapper {
            position: absolute;
            width: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .video-embed {
            position: relative;
            display: inline-flex;
            pointer-events: auto;
            transform-origin: top left;
            gap: 50px; /* Khoảng cách giữa 2 video */
        }
        .video-wrapper {
            flex: 0 0 auto;
            aspect-ratio: 16/9;
            width: 500px;
        }
        .video-iframe {
            width: 100%;
            height: 100%;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background: #000;
        }
    </style>
</head>
<body>
    <div id="pdf-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
        
        let pdfDoc = null;
        let scale = 1;
        const VIDEO_TOP_POSITION = 700; // Vị trí 400px từ đầu PDF
        const VIDEO_WIDTH = 400; // Chiều rộng mỗi video
        const VIDEO_GAP = 300; // Khoảng cách giữa 2 video

        async function renderAllPages() {
            const url = 'https://hmtuan002.github.io/lasa/Hung%20Yen%20Specialities.pdf';
            const container = document.getElementById('pdf-container');
            
            try {
                pdfDoc = await pdfjsLib.getDocument(url).promise;
                container.innerHTML = '';
                
                // Calculate container width
                const containerWidth = document.documentElement.clientWidth - 2;
                
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1 });
                    
                    scale = containerWidth / viewport.width;
                    const scaledViewport = page.getViewport({ scale: scale });
                    
                    const pageContainer = document.createElement('div');
                    pageContainer.className = 'pdf-page-container';
                    pageContainer.style.height = `${scaledViewport.height}px`;
                    
                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page';
                    canvas.height = scaledViewport.height;
                    canvas.width = scaledViewport.width;
                    
                    pageContainer.appendChild(canvas);
                    container.appendChild(pageContainer);
                    
                    // Add videos to the first page only
                    if (i === 1 && VIDEO_TOP_POSITION < scaledViewport.height) {
                        const videoEmbedWrapper = document.createElement('div');
                        videoEmbedWrapper.className = 'video-embed-wrapper';
                        videoEmbedWrapper.style.top = `${VIDEO_TOP_POSITION * scale}px`;
                        videoEmbedWrapper.style.height = `${VIDEO_WIDTH * 9/16 * scale}px`;
                        
                        const videoEmbed = document.createElement('div');
                        videoEmbed.className = 'video-embed';
                        videoEmbed.style.transform = `scale(${scale})`;
                        
                        // Calculate left position to center the videos
                        const totalWidth = (VIDEO_WIDTH * 2 + VIDEO_GAP) * scale;
                        const leftPosition = Math.max((containerWidth - totalWidth) / 2, 0);
                        videoEmbed.style.left = `${leftPosition}px`;
                        
                        // First video
                        const videoWrapper1 = document.createElement('div');
                        videoWrapper1.className = 'video-wrapper';
                        videoWrapper1.innerHTML = `
                            <iframe class="video-iframe" src="https://www.youtube.com/embed/rD3w0mNOSCs" 
                            frameborder="0" allowfullscreen></iframe>
                        `;
                        
                        // Second video
                        const videoWrapper2 = document.createElement('div');
                        videoWrapper2.className = 'video-wrapper';
                        videoWrapper2.innerHTML = `
                            <iframe class="video-iframe" src="https://www.youtube.com/embed/eMIOBO5eyCc" 
                            frameborder="0" allowfullscreen></iframe>
                        `;
                        
                        videoEmbed.appendChild(videoWrapper1);
                        videoEmbed.appendChild(videoWrapper2);
                        videoEmbedWrapper.appendChild(videoEmbed);
                        pageContainer.appendChild(videoEmbedWrapper);
                    }
                    
                    page.render({
                        canvasContext: canvas.getContext('2d'),
                        viewport: scaledViewport
                    });
                }
            } catch (error) {
                console.error('Error loading PDF:', error);
                container.innerHTML = '<p style="color:red; padding:20px; text-align:center;">Error loading PDF document.</p>';
            }
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (pdfDoc) renderAllPages();
            }, 100);
        });

        window.addEventListener('load', renderAllPages);
    </script>
</body>
</html>
